version: 2

models:
  - name: int_dong_code_lookup
    description: One row per district + dong name with its legal dong code
    columns:
      - name: name_key
        tests: [not_null, unique]   # one name must map to exactly one code

  - name: int_building_register_coded
    description: Building register with dong codes filled from names where missing
    columns:
      - name: register_id
        tests: [not_null, unique]   # the fill join must not duplicate buildings
      - name: bjd_code
        tests:
          - not_null:
              config:
                severity: warn      # buildings in dongs with no trades stay missing

  - name: int_register_lots
    description: One row per parcel in the building register
    columns:
      - name: bjd_code
        tests: [not_null]

  - name: int_apartment_trades_matched
    description: Apartment trades with their matched building and the reason for any match failure
    columns:
      - name: trade_id
        tests: [not_null, unique]   # the join must not duplicate trades
      - name: match_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'main_lot_only', 'no_lot_number', 'lot_not_in_register',
                         'no_multi_family_record', 'multiple_multi_family_records']   

  - name: int_register_main_lots
    description: One row per dong + main lot, for second-pass matching
    columns:
      - name: main_lot_key
        tests: [not_null, unique]   # the second join must not duplicate trades either                         